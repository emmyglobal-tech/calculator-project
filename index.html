<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Calculator Pro</title>

<style>
    /* Reset and Center Body */
    body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #000; /* Dark background like iOS */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden; /* Prevents scrolling on mobile */
    }

    .calculator {
        width: 90%; /* Responsive width */
        max-width: 350px; /* Limits size on desktop */
        background: #000;
        padding: 20px;
        border-radius: 40px; /* Softer edges */
    }

    #display {
        height: 100px;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        color: white;
        font-size: 4rem;
        font-weight: 300;
        padding: 10px 20px;
        margin-bottom: 10px;
        word-wrap: break-word;
        word-break: break-all;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
    }

    .btn {
        aspect-ratio: 1 / 1; /* Keeps buttons perfectly circular */
        border-radius: 50%;
        border: none;
        font-size: 1.5rem;
        font-weight: 500;
        cursor: pointer;
        background: #333;
        color: white;
        transition: brightness 0.2s;
        -webkit-tap-highlight-color: transparent; /* Removes blue flash on mobile tap */
        touch-action: manipulation; /* Prevents double-tap zoom delay */
    }

    .btn:active {
        filter: brightness(1.5); /* Visual feedback when pressed */
    }

    .operator {
        background: #ff9f0a;
    }

    .special {
        background: #a5a5a5;
        color: black;
    }

    .col-2 {
        grid-column: span 2;
        aspect-ratio: auto; /* Overrides circle for the long zero button */
        border-radius: 50px;
        text-align: left;
        padding-left: 30px;
    }
</style>
</head>
<body>

<div class="calculator">
  <div id="display">0</div>
  <div class="buttons">
    <button class="btn special" onclick="clearDisplay()">AC</button>
    <button class="btn special" onclick="deleteLast()">DEL</button>
    <button class="btn special" onclick="appendToDisplay('%')">%</button>
    <button class="btn operator" onclick="appendToDisplay('/')">÷</button>
    
    <button class="btn" onclick="appendToDisplay('7')">7</button>
    <button class="btn" onclick="appendToDisplay('8')">8</button>
    <button class="btn" onclick="appendToDisplay('9')">9</button>
    <button class="btn operator" onclick="appendToDisplay('*')">×</button>
    
    <button class="btn" onclick="appendToDisplay('4')">4</button>
    <button class="btn" onclick="appendToDisplay('5')">5</button>
    <button class="btn" onclick="appendToDisplay('6')">6</button>
    <button class="btn operator" onclick="appendToDisplay('-')">−</button>
    
    <button class="btn" onclick="appendToDisplay('1')">1</button>
    <button class="btn" onclick="appendToDisplay('2')">2</button>
    <button class="btn" onclick="appendToDisplay('3')">3</button>
    <button class="btn operator" onclick="appendToDisplay('+')">+</button>
    
    <button class="btn col-2" onclick="appendToDisplay('0')">0</button>
    <button class="btn" onclick="appendToDisplay('.')">.</button>
    <button class="btn operator" onclick="calculate()">=</button>
  </div>
</div>

<script>
    let displayValue = '0';

    function updateDisplay() {
        const display = document.getElementById('display');
        display.innerText = displayValue;
        
        // Dynamic font resizing so numbers don't overflow
        if (displayValue.length > 6) {
            display.style.fontSizes = "2.5rem";
        } else {
            display.style.fontSize = "4rem";
        }
    }

    function appendToDisplay(val) {
        if (displayValue === '0' && val !== '.') {
            displayValue = val;
        } else {
            displayValue += val;
        }
        updateDisplay();
    }

    function clearDisplay() {
        displayValue = '0';
        updateDisplay();
    }

    function deleteLast() {
        displayValue = displayValue.slice(0, -1);
        if (displayValue === '') displayValue = '0';
        updateDisplay();
    }

    function calculate() {
        try {
            // Replaced × and ÷ with computer-readable operators
            let expression = displayValue.replace(/×/g, '*').replace(/÷/g, '/');
            displayValue = eval(expression).toString();
        } catch (e) {
            displayValue = "Error";
        }
        updateDisplay();
    }
</script>

</body>
</html>
